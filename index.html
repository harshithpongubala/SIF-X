/* Background Depth of Field Simulation with Factory Photo & Ambient Lighting */
.dof-stage {
  position: fixed;
  inset: 0;
  pointer-events: none;
  overflow: hidden;
  z-index: 0;
}

.dof-factory-bg {
  position: absolute;
  inset: -20px;
  background-image: url('assets/factory_bg.jpg');
  background-size: cover;
  background-position: center;
  filter: blur(14px) brightness(0.48) saturate(1.2);
  transform: scale(1.05);
  opacity: 0.85;
}

.dof-blur-layer {
  position: absolute;
  inset: -40px;
  filter: blur(45px);
  opacity: 0.7;
  background: 
    radial-gradient(circle at 18% 28%, rgba(245, 158, 11, 0.25) 0%, transparent 45%),
    radial-gradient(circle at 82% 16%, rgba(107, 200, 255, 0.22) 0%, transparent 40%),
    radial-gradient(circle at 50% 65%, rgba(13, 24, 35, 0.6) 0%, transparent 60%),
    radial-gradient(circle at 75% 78%, rgba(245, 158, 11, 0.18) 0%, transparent 45%),
    radial-gradient(circle at 20% 85%, rgba(10, 18, 26, 0.95) 0%, transparent 70%);
}

.dof-vignette {
  position: absolute;
  inset: 0;
  background: radial-gradient(circle at center, transparent 40%, rgba(9, 16, 24, 0.85) 90%, #0d1823 100%);
}

.bokeh-light {
  position: absolute;
  border-radius: 50%;
  filter: blur(35px);
  mix-blend-mode: screen;
  animation: floatBokeh 18s ease-in-out infinite alternate;
}

@keyframes floatBokeh {
  0% { transform: translateY(0px) scale(1); }
  50% { transform: translateY(-28px) scale(1.15); }
  100% { transform: translateY(18px) scale(0.92); }
}

.main-floating-card {
  background: var(--bg-card-main);

class SoundController {

    this.enabled = true;

      const AudioCtx = window.AudioContext || window.webkitAudioContext;

      if (this.ctx.state === 'suspended') this.ctx.resume();
      
      const now = this.ctx.currentTime;
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.connect(gain);
      gain.connect(this.ctx.destination);
      
      if (type === 'critical') {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(880, now);
        osc.frequency.exponentialRampToValueAtTime(320, now + 0.35);
        gain.gain.setValueAtTime(0.25, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.35);
        osc.start(now);
        osc.stop(now + 0.35);
      } else if (type === 'warn') {
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(659.25, now);
        osc.frequency.exponentialRampToValueAtTime(440, now + 0.2);
        gain.gain.setValueAtTime(0.18, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.2);
        osc.start(now);
        osc.stop(now + 0.2);
      } else {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(587.33, now);
        osc.frequency.exponentialRampToValueAtTime(880, now + 0.15);
        gain.gain.setValueAtTime(0.12, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.15);
        osc.start(now);
        osc.stop(now + 0.15);
      }
    } catch (e) {}
  }

// -------------------------------------------------------------
// DYNAMIC SAFETY PRIORITY & PRECURSOR DENSITY AGGREGATOR
// -------------------------------------------------------------
function computeCategoryPriority(reportsList) {
  const counts = {
    'Thermal/Gas': 0,
    'Crane Zones': 0,
    'Forklift/AGV': 0,
    'PPE Compliance': 0,
    'Interlocks': 0,
  };

  (reportsList || []).forEach((r) => {
    const text = `${r.activity || ''} ${r.description || ''}`.toLowerCase();
    
    // Thermal/Gas: Flammable, pressurized, H2S, LOTO line breaking, hot work, confined space
    if (
      text.includes('h2s') || text.includes('gas') || text.includes('pressur') ||
      text.includes('line break') || text.includes('flange') || text.includes('thermal') ||
      text.includes('welding') || text.includes('hot work') || text.includes('confined space') ||
      text.includes('crude line') || text.includes('condensate') || text.includes('acid') ||
      text.includes('demulsifier') || text.includes('tank entry') || text.includes('oxygen')
    ) {
      counts['Thermal/Gas']++;
    }

    // Crane Zones: Crane, hoist, slings, rigging, wire rope, winches
    if (
      text.includes('crane') || text.includes('hoist') || text.includes('sling') ||
      text.includes('wire rope') || text.includes('rigging') || text.includes('winch') ||
      text.includes('lifting') || text.includes('scaffold') || text.includes('load limit') ||
      text.includes('casing pipe') || text.includes('pipe bundle')
    ) {
      counts['Crane Zones']++;
    }

    // Forklift/AGV: Mobile equipment, heavy trucks, reversing, spotters, AGV
    if (
      text.includes('forklift') || text.includes('agv') || text.includes('truck') ||
      text.includes('tanker') || text.includes('vehicle') || text.includes('reversing') ||
      text.includes('spotter') || text.includes('mobile equipment') || text.includes('traffic')
    ) {
      counts['Forklift/AGV']++;
    }

    // PPE Compliance: Ingress protection, harnesses, lanyards, boots, eyewear, high-vis
    if (
      text.includes('ppe') || text.includes('harness') || text.includes('lanyard') ||
      text.includes('tie-off') || text.includes('boots') || text.includes('shoes') ||
      text.includes('eyewash') || text.includes('glasses') || text.includes('gloves') ||
      text.includes('fall arrest') || text.includes('at height') || text.includes('elevation')
    ) {
      counts['PPE Compliance']++;
    }

    // Interlocks: Machine guards, interlock bypasses, E-stop trips, isolation barriers
    if (
      text.includes('interlock') || text.includes('bypass') || text.includes('guard') ||
      text.includes('trip') || text.includes('relay') || text.includes('e-stop') ||
      text.includes('barrier') || text.includes('switchgear') || text.includes('unpadlocked') ||
      text.includes('shutdown switch') || text.includes('line of fire') || text.includes('whip-check')
    ) {
      counts['Interlocks']++;
    }
  });

  const categories = Object.keys(counts).map((id) => ({
    id,
    name: id,
    count: counts[id],
  }));

  // Automatically sort in descending order: highest number of reports first
  categories.sort((a, b) => b.count - a.count);

  const maxCount = Math.max(...categories.map(c => c.count), 1);

  return categories.map((cat, idx) => {
    let priority = 'LOW';
    if (cat.count >= maxCount * 0.70 && cat.count > 0) {
      priority = 'HIGH';
    } else if (cat.count >= maxCount * 0.40 && cat.count > 0) {
      priority = 'MEDIUM';
    }

    return {
      ...cat,
      priority,
      isPeak: idx === 0 && cat.count > 0,
      rank: idx + 1,
    };
  });
}

// SIF NLP PRECURSOR CLASSIFIER (Client-Side & Fallback Engine)
// -------------------------------------------------------------
function classifySafetyReport(report) {
  const text = `${report.activity || ''} ${report.description || ''}`.toLowerCase();
  
  // 1. Identify IOGP Category
  let matchedCategories = [];
  for (const [category, rule] of Object.entries(IOGP_RULES_TAXONOMY)) {
    const hits = rule.keywords.filter(kw => text.includes(kw));
    if (hits.length > 0) {
      matchedCategories.push({ category, hits, count: hits.length, rule });
    }
  }

  let topCategory = 'General Facility Safety';
  let matchedKeywords = [];
  let ruleConfig = null;
  let baseProb = 0.15;

  if (matchedCategories.length > 0) {
    matchedCategories.sort((a, b) => b.count - a.count);
    topCategory = matchedCategories[0].category;
    matchedKeywords = matchedCategories[0].hits;
    ruleConfig = matchedCategories[0].rule;
    baseProb = ruleConfig.baseWeight;
  }

  // 2. Adjust for low-consequence keywords
  const lowHits = LOW_CONSEQUENCE_TERMS.filter(term => text.includes(term));
  if (lowHits.length > 0 && matchedKeywords.length === 0) {
    baseProb = Math.max(0.05, baseProb - 0.10);
  }

  // 3. Adjust for report type
  if (report.report_type === 'Near-Miss') baseProb += 0.05;
  if (report.report_type === 'Unsafe-Condition') baseProb += 0.02;

  // 4. Keyword scalar
  if (matchedKeywords.length >= 3) baseProb += 0.10;
  else if (matchedKeywords.length === 2) baseProb += 0.05;

  const sifProbability = Math.min(0.95, Math.max(0.05, Number(baseProb.toFixed(2))));
  const isSif = sifProbability >= 0.50;

  let confidenceLevel = 'LOW';
  if (matchedKeywords.length >= 3 || sifProbability >= 0.70) confidenceLevel = 'HIGH';
  else if (matchedKeywords.length >= 1 || sifProbability >= 0.40) confidenceLevel = 'MEDIUM';

  const fingerprint = ruleConfig ? {
    hazard: ruleConfig.defaultHazard,
    energy: ruleConfig.energy,
    exposure: ruleConfig.defaultExposure,
    failed_barrier: ruleConfig.defaultBarrier,
  } : {
    hazard: 'Low Energy Operational Environment',
    energy: 'Ambient / Ergonomic',
    exposure: 'Administrative / Non-Hazardous Area',
    failed_barrier: 'Routine Housekeeping Standard',
  };

  const evidenceKeywords = matchedKeywords.length > 0 ? matchedKeywords : lowHits;
  const summary = isSif
    ? `Identified ${evidenceKeywords.length} high-consequence risk factor(s) indicating potential SIF pathway under IOGP rule '${topCategory}'.`
    : 'Routine observation with low energy potential. No critical SIF failure precursor identified.';

  return {
    timestamp: report.timestamp || new Date().toISOString(),
    site: report.site || 'Plant-A',
    activity: report.activity || 'General Operations',
    report_type: report.report_type || 'Near-Miss',
    analysis: {
      sif_probability: sifProbability,
      confidence_level: confidenceLevel,
      iogp_category: topCategory,
      precursor_fingerprint: fingerprint,
      evidence: {
        detected_keywords: evidenceKeywords.slice(0, 8),
        summary: summary,
      },
    },
  };
}

// -------------------------------------------------------------
// HOTSPOT ANALYTICS AGGREGATOR
// -------------------------------------------------------------
function computeHotspotAnalytics(reportsList) {
  const total = reportsList.length;
  if (total === 0) return { sites: [], activities: [], iogp: {}, total: 0, sifCount: 0, rate: 0 };

  const siteMap = {};
  const actMap = {};
  const iogpMap = {};
  const barrierMap = {};
  let sifTotal = 0;

  reportsList.forEach(item => {
    const res = item.analysis ? item : classifySafetyReport(item);
    const site = res.site || 'Plant-A';
    const act = res.activity || 'General';
    const isSif = res.analysis.sif_probability >= 0.50;
    const iogp = res.analysis.iogp_category || 'General';
    const barrier = res.analysis.precursor_fingerprint.failed_barrier;

    if (isSif) sifTotal++;

    iogpMap[iogp] = (iogpMap[iogp] || 0) + 1;
    barrierMap[barrier] = (barrierMap[barrier] || 0) + 1;

    if (!siteMap[site]) siteMap[site] = { site, total: 0, sif: 0, rules: {} };
    siteMap[site].total++;
    if (isSif) {
      siteMap[site].sif++;
      siteMap[site].rules[iogp] = (siteMap[site].rules[iogp] || 0) + 1;
    }

    if (!actMap[act]) actMap[act] = { activity: act, total: 0, sif: 0, barrier: barrier };
    actMap[act].total++;
    if (isSif) actMap[act].sif++;
  });

  const sites = Object.values(siteMap).map(s => {
    const density = s.total > 0 ? Math.round((s.sif / s.total) * 100) : 0;
    const topRule = Object.keys(s.rules).length > 0
      ? Object.entries(s.rules).sort((a, b) => b[1] - a[1])[0][0]
      : 'Nominal';
    return {
      site: s.site,
      total: s.total,
      total_reports: s.total,
      sif: s.sif,
      sif_count: s.sif,
      density,
      sif_density: density,
      topRule,
      top_iogp_rule: topRule
    };
  }).sort((a, b) => b.density - a.density || b.sif - a.sif);

  const activities = Object.values(actMap).map(a => ({
    activity: a.activity,
    total: a.total,
    sif: a.sif,
    sif_count: a.sif,
    barrier: a.barrier,
    top_barrier_failure: a.barrier
  })).sort((a, b) => b.sif - a.sif || b.total - a.total);

  const rate = total > 0 ? Math.round((sifTotal / total) * 100) : 0;

  return {
    sites,
    sites_ranked: sites,
    activities,
    activities_ranked: activities,
    iogp: iogpMap,
    iogp_distribution: iogpMap,
    barriers: barrierMap,
    barrier_failures: barrierMap,
    total,
    total_reports_analyzed: total,
    sifCount: sifTotal,
    sif_precursor_count: sifTotal,
    rate,
    sif_rate_percentage: rate,
  };
}

function App({ onLogout }) {
  const [activeNavTab, setActiveNavTab] = useState(() => {
    try {
      const params = new URLSearchParams(window.location.search);
      return params.get('tab') || 'Dashboard';
    } catch (e) {
      return 'Dashboard';
    }
  });

  const [dashboardFilter, setDashboardFilter] = useState('All');
  const activeFilter = dashboardFilter;
  const setActiveFilter = setDashboardFilter;
  const [showMoreFiltersModal, setShowMoreFiltersModal] = useState(false);
  const [selectedCam, setSelectedCam] = useState('CAM-07'); // Default to CAM-07 (SIH 2026 focal point)
  const [activeDockTab, setActiveDockTab] = useState('overview');

  // Unified Safety Reports Dataset (Single Source of Truth across Dashboard, SIF NLP Engine, & Hotspots)
  const [reports, setReports] = useState(INITIAL_SYNTHETIC_REPORTS);
  const handleAddReport = (newReport) => {
    setReports(prev => [newReport, ...prev]);
  };

  // Dynamic Safety Priority & Precursor Density Categories (Sorted Descending by Report Count)
  const priorityCategories = useMemo(() => computeCategoryPriority(reports), [reports]);

  // Operational Mode: 'demo' vs 'live'
  const [appMode, setAppMode] = useState('demo');
  const [backendOnline, setBackendOnline] = useState(false);
  const [backendHealth, setBackendHealth] = useState(null);

  // Scripted Demo Clock States
  const [demoPlayback, setDemoPlayback] = useState('idle'); // 'idle' | 'playing' | 'paused' | 'complete'
  const [elapsedMs, setElapsedMs] = useState(0);
  const startTimeRef = useRef(0);
  const demoAnimFrameRef = useRef(null);

  // Intervention & Interlock States
  const [eStopEngaged, setEStopEngaged] = useState(false);
  const [interventionDispatched, setInterventionDispatched] = useState(false);

  // Current Phase Calculation from 21.5s Timeline
  const currentPhase = useMemo(() => {
    return PHASE_THRESHOLDS.reduce(
      (current, threshold, idx) => (elapsedMs >= threshold ? idx : current),
      0
    );
  }, [elapsedMs]);

  // Camera & Incident Simulation State (Reused from Cipher reference)
  const activeCamera = useMemo(() => {
    return CAMERA_FEEDS.find(c => c.id === selectedCam) || CAMERA_FEEDS[1];
  }, [selectedCam]);

  const chamberOpen = currentPhase >= 1 && !interventionDispatched;
  const workerAbsent = currentPhase >= 2 && !interventionDispatched;
  const timerActive = currentPhase >= 3 && !interventionDispatched;
  const restorationFailed = currentPhase >= 4 && !interventionDispatched;
  const restorationSeconds = Math.min(
    30,
    Math.max(0, Math.floor((elapsedMs - (PHASE_THRESHOLDS[3] || 6000)) / 220))
  );

  // SINGLE SOURCE OF TRUTH: Unified Risk Score (0 - 1000)
  // Reflects the exact 11-phase CIPHER-X precursor escalation sequence
  const riskScore = useMemo(() => {
    if (interventionDispatched) return 110;
    if (eStopEngaged) return 850;
    if (currentPhase >= 9) return 750;
    if (currentPhase >= 7) return 640;
    if (currentPhase >= 5) return 480;
    if (currentPhase >= 3) return 390;
    if (currentPhase >= 2) return 240;
    if (currentPhase >= 1) return 160;
    return 110;
  }, [currentPhase, eStopEngaged, interventionDispatched]);

  // Derived Percentage: Conceptually riskScore / 10 (e.g. 750 -> 75%, 110 -> 11%)
  const riskPercentage = useMemo(() => {

  // Catmull-Rom cubic spline generator for smooth, continuous data curves
  const generateSpline = (pts) => {
    if (!pts || pts.length < 2) return '';
    let d = `M ${pts[0].x.toFixed(1)},${pts[0].y.toFixed(1)}`;
    const n = pts.length;
    for (let i = 0; i < n - 1; i++) {
      const p0 = i > 0 ? pts[i - 1] : pts[i];
      const p1 = pts[i];
      const p2 = pts[i + 1];
      const p3 = i + 2 < n ? pts[i + 2] : pts[i + 1];
      const c1x = p1.x + (p2.x - p0.x) / 6.0;
      const c1y = p1.y + (p2.y - p0.y) / 6.0;
      const c2x = p2.x - (p3.x - p1.x) / 6.0;
      const c2y = p2.y - (p3.y - p1.y) / 6.0;
      d += ` C ${c1x.toFixed(1)},${c1y.toFixed(1)} ${c2x.toFixed(1)},${c2y.toFixed(1)} ${p2.x.toFixed(1)},${p2.y.toFixed(1)}`;
    }
    return d;
  };

    const chartHeight = 142;
    const baseY = 162;

    const observedCoords = observedRiskData.map((val, i) => ({
      x: 34 + i * stepX,
      y: baseY - (Math.max(0, Math.min(100, val)) / 100) * chartHeight
    }));

    const lastObs = observedCoords[observedCoords.length - 1];
    const forecastCoords = [lastObs, ...forecastRiskData.map((val, i) => ({
      x: lastObs.x + (i + 1) * stepX,
      y: baseY - (Math.max(0, Math.min(100, val)) / 100) * chartHeight
    }))];

    const observedPath = generateSpline(observedCoords);
    const forecastPath = generateSpline(forecastCoords);
    const areaPath = `${observedPath} L ${lastObs.x.toFixed(1)},${baseY} L 34,${baseY} Z`;

      forecastPath,

  const [reportType, setReportType] = useState('Near-Miss');
  const [description, setDescription] = useState('Scaffolding unsecured during high winds at 15m height.');
  const [isProcessing, setIsProcessing] = useState(false);
  const [activeResult, setActiveResult] = useState(null);
  const [jsonExpanded, setJsonExpanded] = useState(true);
  const [batchStatus, setBatchStatus] = useState('');

  // Initial analysis on load
  useEffect(() => {
    const initial = classifySafetyReport({
      site,
      activity,
      report_type: reportType,
      description,
      timestamp: '2026-09-03T19:48:49.769261+00:00'
    });
    setActiveResult(initial);
  }, []);

  const loadPreset = (preset) => {
    setSite(preset.site);
    setActivity(preset.activity);
    setReportType(preset.reportType);
    setDescription(preset.description);
    if (soundFx) soundFx.playPing('info');
    const result = classifySafetyReport({
      site: preset.site,
      activity: preset.activity,
      report_type: preset.reportType,
      description: preset.description,
      timestamp: new Date().toISOString()
    });
    setActiveResult(result);
  };

  const handleAnalyze = async () => {
    setIsProcessing(true);
    if (soundFx) soundFx.playPing('warn');

    if (backendOnline) {
      try {
        const res = await fetch('http://localhost:8000/api/v1/reports/process', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            site,
            activity,
            report_type: reportType,
            description
          })
        });
        if (res.ok) {
          const data = await res.json();
          setActiveResult(data);
          if (onAddReport) {
            onAddReport({
              id: `OIL-USER-${Date.now().toString().slice(-4)}`,
              site,
              activity,
              report_type: reportType,
              description,
              timestamp: new Date().toISOString()
            });
          }
          setIsProcessing(false);
          if (soundFx) soundFx.playPing('info');
          return;
        }
      } catch (err) {
        console.warn('Backend process failed, using client-side engine fallback:', err);
      }
    }

    setTimeout(() => {
      const result = classifySafetyReport({
        site,
        activity,
        report_type: reportType,
        description,
        timestamp: new Date().toISOString()
      });

          id: `OIL-USER-${Date.now().toString().slice(-4)}`,
          site,
          activity,
          report_type: reportType,
          description,
          timestamp: new Date().toISOString()
        });
      }
      setIsProcessing(false);
      if (soundFx) soundFx.playPing('info');
    }, 280);
  };

// -------------------------------------------------------------
// 1.5 WORKER REVIEW VIEW (Dedicated Field Hazard Report Management)
// -------------------------------------------------------------
function WorkerReviewView({
  workerReports,
  onAddWorkerReport,
  selectedReportId,
  setSelectedReportId,
  reportSearchQuery,
  setReportSearchQuery,
  reportSeverityFilter,
  setReportSeverityFilter,
  reportStatusFilter,
  setReportStatusFilter,
  reportCategoryFilter,
  setReportCategoryFilter,
  reportSortBy,
  setReportSortBy,
  reviewNoteInput,
  setReviewNoteInput,
  confirmingResolveReportId,
  setConfirmingResolveReportId,
  workerReviewFeedback,
  setWorkerReviewFeedback,
  handleAcknowledgeReport,
  handleAssignReport,
  handleEscalateReport,
  handleAddReviewNote,
  handleResolveReport,
  handleReopenReport,
  handleInspectLinkedCamera,
  onSwitchTab,
  soundFx
}) {
  const [showNewModal, setShowNewModal] = useState(false);
  const [newCategory, setNewCategory] = useState('Unsafe condition');
  const [newSeverity, setNewSeverity] = useState('Medium');
  const [newLocation, setNewLocation] = useState('Bay B — Line 3 Conveyor');
  const [newWorkerId, setNewWorkerId] = useState('Tech #412 (Demo)');
  const [newCameraId, setNewCameraId] = useState('CAM-04');
  const [newTitle, setNewTitle] = useState('');
  const [newDescription, setNewDescription] = useState('');

  // Confirmation state for escalation
  const [confirmingEscalateId, setConfirmingEscalateId] = useState(null);

  // Compute filtered & sorted reports
  const filteredReports = useMemo(() => {
    let result = [...workerReports];
    if (reportSearchQuery.trim()) {
      const q = reportSearchQuery.toLowerCase();
      result = result.filter(r => 
        r.id.toLowerCase().includes(q) ||
        r.title.toLowerCase().includes(q) ||
        r.location.toLowerCase().includes(q) ||
        r.workerId.toLowerCase().includes(q) ||
        r.category.toLowerCase().includes(q)
      );
    }
    if (reportSeverityFilter !== 'All') {
      result = result.filter(r => r.severity === reportSeverityFilter);
    }
    if (reportCategoryFilter !== 'All') {
      result = result.filter(r => r.category === reportCategoryFilter);
    }
    if (reportStatusFilter !== 'All') {
      result = result.filter(r => r.status === reportStatusFilter);
    }
    if (reportSortBy === 'severity') {
      const rank = { Critical: 4, High: 3, Medium: 2, Low: 1 };
      result.sort((a, b) => (rank[b.severity] || 0) - (rank[a.severity] || 0));
    } else {
      result.sort((a, b) => b.time.localeCompare(a.time));
    }
    return result;
  }, [workerReports, reportSearchQuery, reportSeverityFilter, reportCategoryFilter, reportStatusFilter, reportSortBy]);

  const activeReport = useMemo(() => {
    return workerReports.find(r => r.id === selectedReportId) || filteredReports[0] || workerReports[0];
  }, [workerReports, selectedReportId, filteredReports]);

  const handleSubmitNewReport = (e) => {
    if (e) e.preventDefault();
    if (!newTitle.trim()) return;
    const nowStr = new Date().toTimeString().slice(0, 8);
    const newId = `WR-${Math.floor(4100 + Math.random() * 900)}`;
    const newRep = {
      id: newId,
      time: `${nowStr} UTC`,
      category: newCategory,
      workerId: newWorkerId.trim() || 'Worker (Demo)',
      location: newLocation.trim() || 'Bay B',
      cameraId: newCameraId === 'None' ? null : newCameraId,
      severity: newSeverity,
      title: newTitle.trim(),
      description: newDescription.trim() || newTitle.trim(),
      status: 'New',
      assignedTo: 'Unassigned',
      evidence: 'Direct Field Observation (Demo)',
      history: [
        { time: nowStr, text: `Report filed by ${newWorkerId.trim() || 'Worker'} via Sentinel Portal` }
      ]
    };
    if (onAddWorkerReport) {
      onAddWorkerReport(newRep);
    }
    setNewTitle('');
    setNewDescription('');
    setShowNewModal(false);
  };

  const handleEscalateWithConfirmation = (reportId) => {
    if (confirmingEscalateId === reportId) {
      handleEscalateReport(reportId);
      setConfirmingEscalateId(null);
    } else {
      setConfirmingEscalateId(reportId);
    }
  };

  return (
    <div className="w-full flex flex-col gap-5 animate-fadeIn font-sans">
      {/* 1. TOP HEADER BANNER */}
      <div className="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4 p-4 rounded-2xl bg-black/40 border border-white/10 backdrop-blur-xl shadow-xl">
        <div className="flex items-center gap-3">
          <div className="w-10 h-10 rounded-xl bg-[#6bc8ff]/10 border border-[#6bc8ff]/30 flex items-center justify-center text-[#6bc8ff] shadow-sm">
            <IconFileText className="w-5 h-5" />
          </div>
          <div>
            <div className="flex items-center gap-2 flex-wrap">
              <h2 className="text-lg font-extrabold text-white tracking-tight">
                WORKER REVIEW // Safety Report Management & Hazard Triage
              </h2>
              <span className="px-2 py-0.5 rounded text-[10px] font-mono-dense font-bold bg-[#6bc8ff]/10 border border-[#6bc8ff]/30 text-[#6bc8ff]">
                DEMO REPOSITORY
              </span>
              <span className="px-2 py-0.5 rounded text-[10px] font-mono-dense font-bold bg-amber-500/10 border border-amber-500/30 text-amber-400">
                IN-MEMORY STATE
              </span>
            </div>
            <p className="text-xs text-slate-400 font-mono">
              Field Hazard Investigation Pipeline · Worker-Submitted Observations (ISO 45001 / IOGP Life-Saving Rules)
            </p>
          </div>
        </div>

        <div className="flex items-center gap-2.5 flex-wrap">
          <button
            type="button"
            onClick={() => { setShowNewModal(true); if (soundFx) soundFx.playPing(); }}
            className="px-3.5 py-2 rounded-xl bg-emerald-600/20 hover:bg-emerald-600/30 text-emerald-300 hover:text-white font-mono text-xs font-bold transition-all border border-emerald-500/40 flex items-center gap-1.5 shadow-sm"
          >
            <span>+ File Observation (Demo)</span>
          </button>
          <button
            type="button"
            onClick={() => { onSwitchTab('Dashboard'); if (soundFx) soundFx.playPing(); }}
            className="px-4 py-2 rounded-xl bg-white/10 hover:bg-white/20 text-slate-200 hover:text-white font-mono text-xs font-bold transition-all border border-white/10 flex items-center gap-2 cursor-pointer"
          >
            ← Return to Telemetry
          </button>
        </div>
      </div>

      {/* 2. DYNAMIC METRIC KPI CARDS */}
      <div className="grid grid-cols-2 md:grid-cols-4 gap-3 font-mono">
        <div className="p-3.5 rounded-2xl bg-black/40 border border-white/10 flex flex-col justify-between shadow-lg">
          <div className="flex items-center justify-between text-slate-400 text-xs">
            <span>TOTAL PENDING</span>
            <span className="w-2 h-2 rounded-full bg-amber-400 animate-pulse"></span>
          </div>
          <div className="mt-2 flex items-baseline justify-between">
            <span className="text-2xl font-extrabold text-amber-400">
              {workerReports.filter(r => r.status !== 'Resolved').length}
            </span>
            <span className="text-[10px] text-slate-500">Requires Safety Action</span>
          </div>
        </div>

        <div className="p-3.5 rounded-2xl bg-black/40 border border-white/10 flex flex-col justify-between shadow-lg">
          <div className="flex items-center justify-between text-slate-400 text-xs">
            <span>CRITICAL / HIGH</span>
            <span className="w-2 h-2 rounded-full bg-red-500 animate-ping"></span>
          </div>
          <div className="mt-2 flex items-baseline justify-between">
            <span className="text-2xl font-extrabold text-red-400">
              {workerReports.filter(r => r.status !== 'Resolved' && (r.severity === 'Critical' || r.severity === 'High')).length}
            </span>
            <span className="text-[10px] text-red-500/80">SIF Precursor Escalation</span>
          </div>
        </div>

        <div className="p-3.5 rounded-2xl bg-black/40 border border-white/10 flex flex-col justify-between shadow-lg">
          <div className="flex items-center justify-between text-slate-400 text-xs">
            <span>UNDER REVIEW</span>
            <span className="w-2 h-2 rounded-full bg-[#6bc8ff]"></span>
          </div>
          <div className="mt-2 flex items-baseline justify-between">
            <span className="text-2xl font-extrabold text-[#6bc8ff]">
              {workerReports.filter(r => r.status === 'Under Review').length}
            </span>
            <span className="text-[10px] text-[#6bc8ff]/70">Lead Investigation</span>
          </div>
        </div>

        <div className="p-3.5 rounded-2xl bg-black/40 border border-white/10 flex flex-col justify-between shadow-lg">
          <div className="flex items-center justify-between text-slate-400 text-xs">
            <span>RESOLVED</span>
            <span className="w-2 h-2 rounded-full bg-emerald-400"></span>
          </div>
          <div className="mt-2 flex items-baseline justify-between">
            <span className="text-2xl font-extrabold text-emerald-400">
              {workerReports.filter(r => r.status === 'Resolved').length}
            </span>
            <span className="text-[10px] text-emerald-500/70">Verified Remediation</span>
          </div>
        </div>
      </div>

      {/* 3. FEEDBACK NOTIFICATION BANNER */}
      {workerReviewFeedback && (
        <div className="p-3 rounded-xl bg-emerald-500/15 border border-emerald-500/40 text-emerald-300 font-mono text-xs flex items-center justify-between shadow-md animate-fadeIn">
          <span className="flex items-center gap-2">
            <IconCheckCircle className="w-4 h-4 text-emerald-400 shrink-0" />
            {workerReviewFeedback}
          </span>
          <button type="button" onClick={() => setWorkerReviewFeedback(null)} className="text-slate-400 hover:text-white text-xs px-1">✕</button>
        </div>
      )}

      {/* 4. SEARCH & FILTER TOOLBAR */}
      <div className="p-4 rounded-2xl bg-black/40 border border-white/10 flex flex-col md:flex-row items-stretch md:items-center justify-between gap-3 shadow-lg backdrop-blur-xl">
        {/* Search Input */}
        <div className="relative flex-1 min-w-[220px]">
          <span className="absolute left-3 top-1/2 -translate-y-1/2 text-slate-500 pointer-events-none">
            <IconSearch className="w-4 h-4" />
          </span>
          <input
            type="text"
            value={reportSearchQuery}
            onChange={(e) => setReportSearchQuery(e.target.value)}
            placeholder="Search by ID, keyword, zone, worker, category..."
            className="w-full pl-9 pr-3 py-2 rounded-xl bg-black/50 border border-white/10 text-xs text-slate-200 placeholder:text-slate-500 focus:outline-none focus:border-[#6bc8ff]/50 font-mono"
          />

                  <option value="CAM-04">CAM-04 (Bay B Line 3)</option>
                  <option value="CAM-07">CAM-07 (Pump Station B)</option>

function IncidentFeedView({ visibleEvents, activeFilter, setActiveFilter, onSelectEvent, onSwitchTab, soundFx }) {
  const filtered = useMemo(() => {
    if (activeFilter === 'All') return visibleEvents;
    if (activeFilter === 'Forklift/AGV') {
      return visibleEvents.filter(e => 
        e.badge.includes('PROXIMITY') || 
        e.badge.includes('VEHICLE') || 
        e.text.toLowerCase().includes('forklift') || 
        e.text.toLowerCase().includes('agv') ||
        e.text.toLowerCase().includes('truck')
      );
    }
    if (activeFilter === 'PPE Compliance') {
      return visibleEvents.filter(e => 
        e.badge.includes('PPE') || 
        e.badge.includes('MOTION') || 
        e.text.toLowerCase().includes('ppe') ||
        e.text.toLowerCase().includes('ingress') ||
        e.text.toLowerCase().includes('worker entered')
      );
    }
    if (activeFilter === 'Crane Zones') {
      return visibleEvents.filter(e => 
        e.badge.includes('CRANE') || 
        e.badge.includes('HOIST') || 
        e.badge.includes('LIFT') || 
        e.text.toLowerCase().includes('crane') ||
        e.text.toLowerCase().includes('rigging') ||
        e.text.toLowerCase().includes('hoist')
      );
    }
    if (activeFilter === 'Thermal/Gas') {
      return visibleEvents.filter(e => 
        e.badge.includes('CHAMBER') || 
        e.badge.includes('THERMAL') || 
        e.badge.includes('GAS') || 
        e.text.toLowerCase().includes('pressur') ||
        e.text.toLowerCase().includes('thermal') ||
        e.text.toLowerCase().includes('gas')
      );
    }
    if (activeFilter === 'Interlocks') {
      return visibleEvents.filter(e => 
        e.severity === 'CRITICAL' || 
        e.badge.includes('INVARIANT') || 
        e.badge.includes('MITIGATION') || 
        e.badge.includes('WORKER EXITED') ||
        e.badge.includes('WEAK SIGNAL') ||
        e.badge.includes('SIF PATHWAY')
      );
    }
    return visibleEvents;
  }, [visibleEvents, activeFilter]);

  return (
    <div className="w-full flex flex-col gap-6 animate-fadeIn">
      {/* Top Banner with Return Button */}
      <div className="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4 p-4 rounded-2xl bg-black/40 border border-white/10 backdrop-blur-xl">

            ⚡
          </div>
          <div>
            <div className="flex items-center gap-2">
              <h2 className="text-lg font-extrabold text-white tracking-tight">
                SIF-X Optical & Fused Incident Stream
              </h2>
              <span className="px-2 py-0.5 rounded text-[10px] font-mono-dense font-bold bg-amber-500/10 border border-amber-500/30 text-amber-400">
                {visibleEvents.length} REVEALED
              </span>
            </div>
            <p className="text-xs text-slate-400">
              Real-time Invariant State Logs, Weak-Signal Fusion & Autonomous Precursor Timeline
            </p>
          </div>
        </div>

        <div className="flex items-center gap-2">
          <button
            onClick={() => onSwitchTab('Dashboard')}
            className="px-3.5 py-1.5 rounded-lg bg-[#6bc8ff]/10 border border-[#6bc8ff]/30 hover:bg-[#6bc8ff]/20 text-xs font-mono-dense font-bold text-[#6bc8ff] hover:text-white transition-all flex items-center gap-1.5 shadow-sm"
          >
            <span>← Return to CAM-07 Sentinel</span>
          </button>
        </div>
      </div>

      {/* Filter Buttons */}
      <div className="flex items-center gap-2 overflow-x-auto pb-1 custom-scrollbar">
        {['All', 'Forklift/AGV', 'PPE Compliance', 'Crane Zones', 'Thermal/Gas', 'Interlocks'].map((f) => (
          <button
            key={f}
            onClick={() => { setActiveFilter(f); if (soundFx) soundFx.playPing('info'); }}
            className={'px-3 py-1.5 rounded-xl text-xs font-mono-dense font-bold border transition-all whitespace-nowrap ' + (
              activeFilter === f
                ? 'bg-[#6bc8ff]/20 border-[#6bc8ff] text-white shadow-sm'

            )}

function MiniCCTVCanvas({ aiBoxesEnabled, eStopEngaged, selectedCam, currentPhase, sifState, interventionDispatched }) {
  const canvasRef = useRef(null);

  useEffect(() => {
    const canvas = canvasRef.current;
    if (!canvas) return;
    const ctx = canvas.getContext('2d');
    let frame = 0;
    let animId;

    let workerX = 55;
    let workerDir = 1;
    let forkliftX = 180;
    let forkliftDir = -1;
    let sparks = [];

    const render = () => {
      frame++;
      const w = canvas.width = 240;
      const h = canvas.height = 135;

      // Dark industrial floor
      ctx.fillStyle = '#0a141e';
      ctx.fillRect(0, 0, w, h);

      // Perspective floor grid
      ctx.strokeStyle = 'rgba(107, 200, 255, 0.09)';
      ctx.lineWidth = 0.8;
      for (let i = 0; i < w; i += 24) {
        ctx.beginPath();
        ctx.moveTo(i, h);
        ctx.lineTo(w / 2 + (i - w / 2) * 0.35, h * 0.42);
        ctx.stroke();
      }

      if (selectedCam === 'CAM-07') {
        // CAM-07: Pump Station B - High Pressure Chamber (Primary SIF Focal Zone)
        ctx.fillStyle = '#142332';
        ctx.fillRect(70, 30, 100, 75);
        ctx.strokeStyle = '#27435e';
        ctx.strokeRect(70, 30, 100, 75);

        // High Pressure Piping
        ctx.strokeStyle = '#385d80';
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.moveTo(30, 60);
        ctx.lineTo(70, 60);
        ctx.moveTo(170, 60);
        ctx.lineTo(210, 60);
        ctx.stroke();

        // Pressurized Chamber Door: Open during phase 1-10 unless interventionDispatched
        const isChamberOpen = currentPhase >= 1 && !interventionDispatched;
        if (isChamberOpen) {
          ctx.fillStyle = '#0f1a24';
          ctx.fillRect(95, 45, 50, 45);
          ctx.strokeStyle = '#f59e0b';
          ctx.lineWidth = 3;
          ctx.beginPath();
          ctx.moveTo(95, 45);
          ctx.lineTo(82, 35);
          ctx.stroke();
          
          ctx.fillStyle = sifState === 'CRITICAL' ? '#ef4444' : '#f59e0b';
          ctx.font = 'bold 7px "JetBrains Mono"';
          ctx.fillText('OPEN CHAMBER', 96, 70);
        } else {
          ctx.fillStyle = '#1e384f';
          ctx.fillRect(95, 45, 50, 45);
          ctx.fillStyle = '#10b981';
          ctx.font = '7px "JetBrains Mono"';
          ctx.fillText(interventionDispatched ? 'SECURED BY ACTION' : 'SEALED SECURE', 90, 70);
        }

        // Worker presence: Present during phase 0-1 or upon intervention response
        const isWorkerPresent = (currentPhase <= 1 || interventionDispatched) && !eStopEngaged;
        if (isWorkerPresent) {
          const px = 145;
          const py = 95;
          ctx.fillStyle = '#10b981';
          ctx.fillRect(px - 5, py - 12, 10, 15);
          ctx.fillStyle = '#f59e0b';
          ctx.beginPath();
          ctx.arc(px, py - 16, 4, 0, Math.PI * 2);
          ctx.fill();

          if (aiBoxesEnabled) {
            ctx.strokeStyle = '#10b981';
            ctx.lineWidth = 1;
            ctx.strokeRect(px - 8, py - 22, 16, 28);
            ctx.fillStyle = '#10b981';
            ctx.font = '6px "JetBrains Mono"';
            ctx.fillText(interventionDispatched ? 'MARSHALL ALEX · PPE 100%' : 'TECHNICIAN · PPE 100%', px - 22, py - 24);
          }
        }

        // Simulated Bounding Boxes for Chamber
        if (aiBoxesEnabled) {
          ctx.strokeStyle = isChamberOpen ? (sifState === 'CRITICAL' ? '#ef4444' : '#f59e0b') : '#10b981';
          ctx.lineWidth = isChamberOpen ? 1.5 : 1;
          ctx.strokeRect(90, 40, 60, 55);
          ctx.fillStyle = ctx.strokeStyle;
          ctx.font = '6px "JetBrains Mono"';
          ctx.fillText(
            isChamberOpen ? (currentPhase >= 2 ? 'ALERT: UNATTENDED OPEN' : 'MAINTENANCE IN PROGRESS') : 'CHAMBER INTEGRITY OK',
            80, 36
          );
        }

      } else if (selectedCam === 'CAM-03') {
        // CAM-03: Worker Fall Monitoring / Walkway P-07
        ctx.fillStyle = '#152535';
        ctx.fillRect(35, h * 0.58, 170, 16);
        ctx.strokeStyle = '#22384c';
        for (let x = 40; x < 200; x += 15) {
          ctx.beginPath();
          ctx.moveTo(x, h * 0.58);
          ctx.lineTo(x, h * 0.58 + 16);
          ctx.stroke();
        }

        if (!eStopEngaged) {
          workerX += 0.35 * workerDir;
          if (workerX > 165) workerDir = -1;
          if (workerX < 45) workerDir = 1;
        }
        const workerY = h * 0.72;
        ctx.fillStyle = '#10b981';
        ctx.fillRect(workerX - 5, workerY - 12, 10, 15);
        ctx.fillStyle = '#f59e0b';
        ctx.beginPath();
        ctx.arc(workerX, workerY - 16, 4, 0, Math.PI * 2);
        ctx.fill();

        if (aiBoxesEnabled) {
          ctx.strokeStyle = '#10b981';
          ctx.lineWidth = 1;
          ctx.strokeRect(workerX - 8, workerY - 22, 16, 28);
          ctx.fillStyle = '#10b981';
          ctx.font = '6px "JetBrains Mono"';
          ctx.fillText('POSTURE: NOMINAL · 99% COMPLIANT', workerX - 25, workerY - 24);

          ctx.strokeStyle = 'rgba(107, 200, 255, 0.4)';
          ctx.strokeRect(35, h * 0.55, 170, 24);
          ctx.fillStyle = '#6bc8ff';
          ctx.fillText('WALKWAY P-07 TRACTION ZONE', 40, h * 0.52);
        }
      } else if (selectedCam === 'CAM-11') {
        // CAM-11: Liquid Spill Detection / Pump Seal
        ctx.fillStyle = '#1e2d3d';
        ctx.fillRect(40, 35, 60, 65);
        ctx.fillRect(140, 35, 60, 65);

        ctx.strokeStyle = '#385d80';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(100, 65);
        ctx.lineTo(140, 65);
        ctx.stroke();

        ctx.fillStyle = '#10b981';
        ctx.font = '7px "JetBrains Mono"';
        ctx.fillText('PUMP P-104 SEAL', 45, 50);
        ctx.fillText('DRAIN TROUGH B', 145, 50);

        // Persistent liquid region representation
        ctx.fillStyle = 'rgba(107, 200, 255, 0.25)';
        ctx.beginPath();
        ctx.ellipse(120, 100, 35, 12, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = 'rgba(107, 200, 255, 0.6)';
        ctx.stroke();

        if (aiBoxesEnabled) {
          ctx.strokeStyle = '#6bc8ff';
          ctx.lineWidth = 1;
          ctx.strokeRect(80, 85, 80, 30);
          ctx.fillStyle = '#6bc8ff';
          ctx.font = '6px "JetBrains Mono"';
          ctx.fillText('LIQUID REGION: 0.84m² (STABLE)', 82, 82);
        }
      } else {
        // CAM-16: Restricted Gate / Public Walkway & Traffic
        ctx.fillStyle = '#182430';
        ctx.fillRect(20, 30, 200, 80);

        ctx.strokeStyle = 'rgba(245, 158, 11, 0.3)';
        ctx.lineWidth = 1;
        ctx.setLineDash([4, 4]);
        ctx.strokeRect(40, 45, 160, 55);
        ctx.setLineDash([]);

        if (!eStopEngaged) {
          forkliftX += 0.45 * forkliftDir;
          if (forkliftX > 175) forkliftDir = -1;
          if (forkliftX < 55) forkliftDir = 1;
        }
        const forkliftY = h * 0.70;
        ctx.fillStyle = '#f59e0b';
        ctx.fillRect(forkliftX - 12, forkliftY - 12, 24, 16);
        ctx.fillStyle = '#1e293b';
        ctx.fillRect(forkliftX - 10, forkliftY + 3, 6, 4);
        ctx.fillRect(forkliftX + 4, forkliftY + 3, 6, 4);

        if (aiBoxesEnabled) {
          ctx.strokeStyle = '#f59e0b';
          ctx.lineWidth = 1;
          ctx.strokeRect(forkliftX - 16, forkliftY - 20, 32, 26);
          ctx.fillStyle = '#f59e0b';
          ctx.font = '6px "JetBrains Mono"';
          ctx.fillText('AGV-04 · RESTRICTED ACCESS GATE', forkliftX - 25, forkliftY - 22);

          ctx.strokeStyle = '#ef4444';
          ctx.strokeRect(40, 45, 160, 55);
          ctx.fillStyle = '#ef4444';
          ctx.fillText('EXCLUSION POLYGON: LZ-03', 44, 42);
        }
      }

      // E-Stop Overlay
      if (eStopEngaged) {
        ctx.fillStyle = 'rgba(239, 68, 68, 0.45)';
        ctx.fillRect(0, 0, w, h);
        ctx.fillStyle = '#ffffff';
        ctx.font = 'bold 9px "JetBrains Mono"';
        ctx.fillText('EMERGENCY E-STOP ENGAGED', 52, 70);
      }

      animId = requestAnimationFrame(render);
    };

    animId = requestAnimationFrame(render);
    return () => cancelAnimationFrame(animId);
  }, [aiBoxesEnabled, eStopEngaged, selectedCam, currentPhase, sifState, interventionDispatched]);

  return <canvas ref={canvasRef} className="w-full h-full object-cover" />;
}

// RISK FORECASTING LINE GRAPH (SVG Predictive Model)
// -------------------------------------------------------------
function RiskForecastingGraph({ onHoverPoint, riskScore, currentPhase }) {
  const dynamicRiskElev = useMemo(() => {
    return Math.floor((riskScore / 1000) * 35);
  }, [riskScore]);

  const points = useMemo(() => [
    { time: '00:00', val: 12, desc: 'Night shift baseline safe' },
    { time: '03:00', val: 14, desc: 'Normal autonomous logistics' },
    { time: '06:00', val: 22, desc: 'Morning shift prep' },
    { time: '09:00', val: 38, desc: 'High forklift traffic' },
    { time: '11:42', val: Math.min(68, 20 + dynamicRiskElev), desc: currentPhase >= 9 ? 'CRITICAL SIF PRECURSOR PATHWAY' : 'Scheduled maintenance observation' },
    { time: '14:00', val: Math.min(70, 42 + dynamicRiskElev), desc: 'Shift handover peak hazard' },
    { time: '16:00', val: 32, desc: 'Robotic welding cell active' },
    { time: '18:00', val: 20, desc: 'Evening assembly baseline' },
    { time: '21:00', val: 15, desc: 'Automated sweep normal' },
    { time: '23:59', val: 11, desc: 'Plant 04 nominal' },
  ], [dynamicRiskElev, currentPhase]);

  const w = 780;
  const h = 90;
  const padding = 20;

  const getX = (index) => padding + (index / (points.length - 1)) * (w - 2 * padding);
  const getY = (val) => h - padding - (val / 75) * (h - 2 * padding);

  const pathD = points.reduce((acc, pt, idx) => {
    const x = getX(idx);
    const y = getY(pt.val);
    return idx === 0 ? `M ${x},${y}` : `${acc} L ${x},${y}`;
  }, '');

  const areaD = `${pathD} L ${getX(points.length - 1)},${h} L ${getX(0)},${h} Z`;

  return (
    <svg viewBox={`0 0 ${w} ${h}`} className="w-full h-full">
      <defs>
        <linearGradient id="riskGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stopColor="#6bc8ff" stopOpacity="0.35" />
          <stop offset="100%" stopColor="#6bc8ff" stopOpacity="0.0" />
        </linearGradient>
      </defs>

      <line x1={padding} y1={getY(20)} x2={w - padding} y2={getY(20)} stroke="rgba(255, 255, 255, 0.07)" strokeDasharray="3 3" />
      <line x1={padding} y1={getY(45)} x2={w - padding} y2={getY(45)} stroke="rgba(239, 68, 68, 0.4)" strokeDasharray="4 4" />

      <path d={areaD} fill="url(#riskGrad)" />
      <path d={pathD} fill="none" stroke="#6bc8ff" strokeWidth="2.5" strokeLinecap="round" />

      {points.map((pt, idx) => {
        const cx = getX(idx);
        const cy = getY(pt.val);
        const isCritical = pt.val > 45;
        return (
          <g key={pt.time} className="cursor-pointer" onMouseEnter={() => onHoverPoint(pt)} onMouseLeave={() => onHoverPoint(null)}>
            <circle
              cx={cx}
              cy={cy}
              r={isCritical ? 5 : 3.5}
              fill={isCritical ? '#ef4444' : '#6bc8ff'}
              stroke="#0d1823"
              strokeWidth="2"
              className="hover:scale-150 transition-transform"
            />
            <text x={cx} y={h - 2} fill="#64748b" fontSize="8" textAnchor="middle" fontFamily="JetBrains Mono">
              {pt.time}
            </text>
          </g>
        );
      })}
    </svg>
  );
}

// -------------------------------------------------------------
// MAGNETIC CURSOR LAYER (GSAP Physics Effect)
// -------------------------------------------------------------
function MagneticCursorLayer() {
  const cursorRef = useRef(null);

  useEffect(() => {
    const el = cursorRef.current;
    if (!el || !window.gsap) return;

    let posX = window.innerWidth / 2;
    let posY = window.innerHeight / 2;
    let mouseX = posX;
    let mouseY = posY;

    const onMove = (e) => {
      mouseX = e.clientX;
      mouseY = e.clientY;
    };

    window.addEventListener('mousemove', onMove);

    const ticker = () => {
      posX += (mouseX - posX) * 0.2;
      posY += (mouseY - posY) * 0.2;
      window.gsap.set(el, {
        x: posX,
        y: posY,
        xPercent: -50,
        yPercent: -50,
      });
    };

    window.gsap.ticker.add(ticker);

    return () => {
      window.removeEventListener('mousemove', onMove);
      if (window.gsap) window.gsap.ticker.remove(ticker);
    };
  }, []);

  return (
    <div 
      ref={cursorRef} 
      className="magnetic-cursor w-7 h-7 bg-white rounded-full opacity-80"
    />
  );
}

// Global Application Error Boundary
class ErrorBoundary extends React.Component {
  constructor(props) {
    super(props);
    this.state = { hasError: false, error: null, errorInfo: null };
  }
  static getDerivedStateFromError(error) {
    return { hasError: true, error };
  }
  componentDidCatch(error, errorInfo) {
    console.error("SIF-X Application Error:", error, errorInfo);
    this.setState({ errorInfo });
    window.__SIF_LAST_ERROR__ = {
      name: error ? error.name : 'UnknownError',
      message: error ? error.message : '',
      stack: error ? error.stack : '',
      componentStack: errorInfo ? errorInfo.componentStack : ''
    };
  }
  render() {
    if (this.state.hasError) {
      return (
        <div className="min-h-screen bg-[#0d1823] text-slate-100 flex flex-col items-center justify-center p-6 text-center font-mono">
          <div className="w-16 h-16 rounded-2xl bg-red-500/10 border border-red-500/30 flex items-center justify-center text-red-400 text-2xl mb-4 shadow-lg">
            ⚠️
          </div>
          <h2 className="text-xl font-extrabold text-white mb-2">SIF-X TELEMETRY RECOVERY</h2>
          <p className="text-xs text-slate-400 max-w-md mb-4 leading-relaxed">
            An isolated component encountered an exception. The core SIF-X engine and optical sentinel remain intact.
          </p>
          {this.state.error && (
            <div id="actual-crash-error" className="mb-6 p-4 bg-red-950/80 border border-red-500/40 rounded-xl text-left text-[11px] text-red-200 max-w-lg font-mono overflow-auto max-h-56">
              <div className="font-bold text-red-300 mb-1">{String(this.state.error.name)}: {String(this.state.error.message)}</div>
              {this.state.error.stack && (
                <div className="text-[10px] text-red-400/90 whitespace-pre-wrap">{String(this.state.error.stack)}</div>
              )}
              {this.state.errorInfo && this.state.errorInfo.componentStack && (
                <div className="text-[9px] text-red-500/80 mt-2 whitespace-pre-wrap border-t border-red-500/20 pt-1">
                  Component Stack:{String(this.state.errorInfo.componentStack)}
                </div>
              )}
            </div>
          )}
          <button
            onClick={() => { this.setState({ hasError: false, error: null, errorInfo: null }); window.location.reload(); }}
            className="px-5 py-2.5 rounded-xl bg-[#6bc8ff]/20 border border-[#6bc8ff]/40 text-[#6bc8ff] font-bold text-xs hover:bg-[#6bc8ff]/30 transition-all shadow-md cursor-pointer"
          >
            ← Restart Application
          </button>
        </div>
      );
    }
    return this.props.children;
  }
}

// ROOT COMPONENT WITH PERSISTENT AUTHENTICATION STATE
// -------------------------------------------------------------
function RootApp() {
  const [isAuthenticated, setIsAuthenticated] = useState(() => {
    return sessionStorage.getItem('sifx_authenticated') === 'true';
  });

  const handleLogin = () => {
    sessionStorage.setItem('sifx_authenticated', 'true');
    setIsAuthenticated(true);
  };

  const handleLogout = () => {
    sessionStorage.removeItem('sifx_authenticated');
    setIsAuthenticated(false);
  };

  if (!isAuthenticated) {
    return <LoginPage onLogin={handleLogin} />;
  }

  return <App onLogout={handleLogout} />;
}
